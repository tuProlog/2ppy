site_name: 2PPy
site_description: tuProlog for Python, the open ecosystem for symbolic AI and logic programming
site_url: https://tuprolog.github.io/2ppy/
repo_url: https://github.com/tuProlog/2ppy
repo_name: tuProlog/2ppy
edit_uri: edit/master/
copyright: Copyright &copy; the tuProlog team, Apache License 2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/getting-started.md
      - tutorials/your-first-logic-program.md
  - How-to guides:
      - how-to/index.md
      - how-to/build-and-parse-terms.md
      - how-to/query-solvers.md
      - how-to/define-predicates-in-python.md
      - how-to/use-python-objects-from-prolog.md
      - how-to/read-and-write-streams.md
      - how-to/handle-errors.md
      - how-to/run-probabilistic-programs.md
      - how-to/use-the-repl.md
      - how-to/contribute.md
  - Examples:
      - examples/index.md
      - Terms and unification: examples/01-terms-and-unification.ipynb
      - Knowledge bases and queries: examples/02-knowledge-bases-and-queries.ipynb
      - Predicates and functions in Python: examples/03-predicates-and-functions-in-python.ipynb
      - Python objects from Prolog: examples/04-python-objects-from-prolog.ipynb
      - Input and output: examples/05-input-and-output.ipynb
      - Probabilistic logic programming: examples/06-probabilistic-logic-programming.ipynb
      - The N-queens puzzle: examples/07-n-queens.ipynb
  - Reference:
      - reference/index.md
      - reference/package-map.md
      - reference/python-term-conversions.md
      - reference/exceptions.md
      - reference/standard-predicates.md
      - reference/iolib.md
      - reference/ooplib.md
      - API reference: api/
  - Explanation:
      - explanation/index.md
      - explanation/logic-programming.md
      - explanation/terms-and-variables.md
      - explanation/solvers-and-solutions.md
      - explanation/architecture.md
      - explanation/relationship-with-2p-kt.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocs-jupyter:
      execute: false # the notebooks keep their outputs, and the tests run them
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
