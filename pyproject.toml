[project]
name = "2ppy"
version = "1.7.0"
description = "Python-based implementation of tuProlog -- the open ecosystem for symbolic AI --, based on 2P-Kt"
readme = "README.md"
authors = [
    { name = "Giovanni Ciatto", email = "giovanni.ciatto@unibo.it" },
    { name = "Luca Deluigi", email = "luca.deluigi5@unibo.it" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["prolog", "symbolic ai", "ecosystem", "tuprolog", "2p", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Prolog",
]
requires-python = ">=3.10" # Update workflows/check.yml if you change this
dependencies = [
    "jdk4py>=21.0.8.2",
    "jpype1>=1.7.1",
    "textual>=8.2.4,<9",
]

[project.scripts]
2ppy-tui = "tuprolog.tui:main"

[project.urls]
Homepage = "https://github.com/tuProlog/2ppy"
Documentation = "https://tuprolog.github.io/2ppy/"
Issues = "https://github.com/tuProlog/2ppy/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# `uv sync` installs the documentation tools too
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-name = "tuprolog"
module-root = ""

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "jupyter>=1.1.1",
    "mypy>=2.1.0",
    "poethepoet>=0.45.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.12",
]
docs = [
    "mkdocs>=1.6.1,<2", # MkDocs 2 is planned to drop the plugins and themes used here
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.9",
]

[tool.poe.tasks.build-jars]
# compiles the JVM side (jvm/, a Gradle project) and copies it, with 2P-Kt's JARs, into
# tuprolog/libs/: needed before testing or building
shell = "./gradlew --quiet installJars"
interpreter = ["posix", "pwsh", "powershell"]
cwd = "jvm"

[tool.poe.tasks.test-jvm]
# tests the JVM side (jvm/src/test)
shell = "./gradlew --quiet test"
interpreter = ["posix", "pwsh", "powershell"]
cwd = "jvm"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy tuprolog tests scripts"
compile = "python -m compileall -q tuprolog tests scripts"
static-checks = [
    "compile",
    "format-check",
    "ruff-check",
    "mypy",
]
static-fixes = [
    "ruff-fix",
    "format",
]
# the documentation site (see mkdocs.yml), with the API reference generated from the docstrings
docs = "mkdocs build --strict"
docs-serve = "mkdocs serve"
# Local, untracked Git hooks; append hook names to pick some (pre-commit,
# conventional-commits, no-ai-signature, pre-push)
install-hooks = "python scripts/githooks.py install"
uninstall-hooks = "python scripts/githooks.py uninstall"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the JVM handles SIGSEGV internally: faulthandler would intercept it and crash the run
addopts = "-p no:faulthandler"
asyncio_mode = "auto" # the Textual tests (tests/tui) are coroutines
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # sub-packages re-export their _definitions/_api, and load their _adapters
"tests/core/test_kt_math.py" = ["RUF032"] # deliberately tests exact float -> Decimal conversions

[tool.mypy]
# JVM classes are re-exported as plain variables (e.g. `Term = _core.Term`): annotations using them
# are opaque to mypy (Any), as JPype offers no static types for the JVM
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
# JPype ships no type information; JVM packages (it.unibo..., java..., kotlin...) are only known at runtime
module = ["jpype", "jpype.*", "_jpype", "jdk4py", "it.*", "java.*", "kotlin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the Python API (factories and helpers) is fully annotated: keep it so, for users type-checking their code
module = ["tuprolog.*._api", "tuprolog.pyutils"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
